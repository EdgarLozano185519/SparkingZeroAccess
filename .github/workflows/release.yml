name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION', expected e.g. 1.0.1"
            exit 1
          fi

      - name: Update VERSION file
        shell: bash
        run: echo "$VERSION" > VERSION

      - name: Commit version bump (if changed)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --cached --quiet; then
            echo "Version already $VERSION, no commit needed"
          else
            git commit -m "Release v$VERSION"
            git push
          fi

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version $env:VERSION

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "v$VERSION" \
            "build/output/SparkingZeroAccess-Setup-$VERSION.exe" \
            "build/output/SparkingZeroAccess-$VERSION-manual.zip" \
            --title "v$VERSION" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
